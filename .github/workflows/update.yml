name: Update IPTV Playlist

on:
  schedule:
    # UTC 16:00 ≈ 北京时间每天 00:00 更新一次
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # 允许在 GitHub 网页手动“Run workflow”立即触发

permissions:
  contents: write        # 需要写权限把合并结果推回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge sources
        run: python merge.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged.m3u
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto merge iptv @ $(date +%Y-%m-%dT%H:%M:%S%z)"
            git push
          fi
